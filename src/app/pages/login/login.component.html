<div class="login-page">
    <!-- Decorative background grid -->
    <div class="bg-grid"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
  
    <div class="login-container">
      <!-- Logo / Brand -->
      <div class="brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="10" height="10" rx="2" fill="currentColor" opacity="1"/>
            <rect x="16" y="2" width="10" height="10" rx="2" fill="currentColor" opacity="0.6"/>
            <rect x="2" y="16" width="10" height="10" rx="2" fill="currentColor" opacity="0.6"/>
            <rect x="16" y="16" width="10" height="10" rx="2" fill="currentColor" opacity="0.35"/>
          </svg>
        </div>
        <span class="brand-name">Taskboard</span>
      </div>
  
      <div class="login-card">
        <div class="card-header">
          <h1>Welcome back</h1>
          <p>Sign in to your workspace</p>
        </div>
  
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              placeholder="you@company.com"
              autocomplete="email"
              [class.input-error]="errorMessage"
            />
          </div>
        </div>
  
        <div class="form-group">
          <label for="password">
            Password
            <a href="#" class="forgot-link" (click)="$event.preventDefault()">Forgot?</a>
          </label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              placeholder="••••••••"
              autocomplete="current-password"
              [class.input-error]="errorMessage"
            />
            <button class="toggle-pw" (click)="togglePassword()" type="button" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>
  
        <div class="error-box" *ngIf="errorMessage">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ errorMessage }}
        </div>
  
        <button class="btn-login" (click)="onLogin()" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign in</span>
          <span *ngIf="isLoading" class="spinner-wrap">
            <span class="spinner"></span>
            Signing in…
          </span>
        </button>
  
        <div class="divider"><span>demo credentials</span></div>
  
        <div class="demo-hint">
          <code>admin&#64;task.io</code> &nbsp;/&nbsp; <code>password</code>
        </div>
      </div>
  
      <p class="footer-note">By signing in, you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy</a></p>
    </div>
  </div>
